  .mono{border-color:#a8754f;color:#7a4f37;background:#fffaf2}
  .bk{color:#7a4f37}.be{color:#9a7b62}

</style>

<div class="toast" id="toast">명함 내용이 복사됐어요</div>
<script>
  const url = 'https://blessalpha.com/card/';
  const cardText = '조하준 소장 (Joseph Cho)\n블레스알파랩 BlessAlpha Lab\nAI 교육 & 강의 / 업무 자동화 컨설팅\n010-5909-2567\njoseph@blessalpha.com\n서울특별시 강동구 고덕로28길 10-9, 1층 (BLESS LAB)';
  const withLink = cardText + '\n' + url;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.getElementById('smsBtn').href = (isIOS ? 'sms:&body=' : 'sms:?body=') + encodeURIComponent(withLink);
  document.getElementById('share').addEventListener('click', async () => {
    if (navigator.share) { try { await navigator.share({ text: cardText, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(withLink); } catch (e) { const t = document.createElement('textarea'); t.value = withLink; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    const el = document.getElementById('toast'); el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800);
  });
</script>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-live="polite"></div>
<script>
  // 2026-11-06: 연락처 저장을 폰·브라우저별로 '저장 화면'까지 바로 가게 한다.
  (function(){
    const VCF = 'https://blessalpha.com/card/joseph-cho.vcf?v=4';
    const SELF = 'https://blessalpha.com/card/?save=1';
    const ua = navigator.userAgent;
    const isIOSd = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    const isKakao = /KAKAOTALK/i.test(ua);
    const isInApp = isKakao || /Instagram|FBAN|FBAV|FB_IAB|NAVER\(inapp|Line\/|DaumApps|everytimeApp|BAND\/|; wv\)/i.test(ua);
    const isIOSSafari = isIOSd && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|Whale|NAVER|KAKAOTALK|Instagram|FBAN|Line\//i.test(ua);
    const sheet = document.getElementById('sheet'), bg = document.getElementById('sheetBg');
    function go(u){ window.__lastNav = u; if (window.__noNav) return; location.href = u; }
    function hide(){ sheet.classList.remove('on'); bg.classList.remove('on'); }
    bg.addEventListener('click', hide);
    function copyLink(){ const u = 'https://blessalpha.com/card/'; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).catch(()=>{ const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }); const b=document.getElementById('cpBtn'); if (b) b.textContent='링크를 복사했어요'; }
    function show(kind){
      const steps = {
        ios: ['<h3>Safari에서 열면 바로 저장돼요</h3>', ['아래 버튼으로 링크를 복사하세요.', '<b>Safari</b>를 열고 주소창에 붙여넣은 뒤, <b>[연락처 저장]</b>을 누르세요.', '연락처 화면에서 <b>[새로운 연락처 생성]</b>을 누르면 끝이에요.'], '', '<button class="sbtn" id="cpBtn">명함 링크 복사</button><button class="sbtn line" data-close>닫기</button>'],
        inapp: ['<h3>이 앱 안에서는 저장이 안 돼요</h3>', ['화면 위나 아래의 <b>··· 메뉴</b>를 누르세요.', '<b>Safari로 열기</b>(또는 다른 브라우저로 열기)를 누르세요.', '열린 화면에서 <b>[연락처 저장]</b>을 다시 누르면 돼요.'], '메뉴가 없으면 링크를 복사해서 Safari에 붙여넣어 주세요.', '<button class="sbtn" id="cpBtn">명함 링크 복사</button><button class="sbtn line" data-close>닫기</button>'],
        again: ['<h3>아래 버튼을 누르면 연락처에 저장돼요</h3>', [], '', '<button class="sbtn" id="againBtn">연락처 저장</button><button class="sbtn line" data-close>닫기</button>']
      }[kind];
      sheet.innerHTML = steps[0] + (steps[1].length ? '<ol>' + steps[1].map((t,i)=>'<li><b class="n">'+(i+1)+'</b><span>'+t+'</span></li>').join('') + '</ol>' : '') + (steps[2] ? '<p class="tip">'+steps[2]+'</p>' : '') + steps[3];
      sheet.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', hide));
      const cp = document.getElementById('cpBtn'); if (cp) cp.addEventListener('click', copyLink);
      const ag = document.getElementById('againBtn'); if (ag) ag.addEventListener('click', e => { hide(); save(e); });
      bg.classList.add('on'); requestAnimationFrame(() => sheet.classList.add('on'));
      window.__sheet = kind;
    }
    function save(ev){
      if (ev) ev.preventDefault();
      if (isInApp) {
        if (isKakao) { go('kakaotalk://web/openExternal?url=' + encodeURIComponent(SELF)); return; }
        if (isAndroid) { go('intent://blessalpha.com/card/?save=1#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(VCF) + ';end'); return; }
        show('inapp'); return;
      }
      if (isIOSd) { if (isIOSSafari) { go(VCF); } else { show('ios'); } return; }
      if (isAndroid) { download(); const hn = document.getElementById('saveHint'); hn.hidden = false; window.__hint = true; return; }
      download();
    }
    function download(){ const a = document.createElement('a'); a.href = VCF; a.download = '조하준_블레스알파랩.vcf'; document.body.appendChild(a); window.__lastNav = 'download:' + VCF; if (!window.__noNav) a.click(); a.remove(); }
    window.__save = save;
    document.getElementById('saveBtn').addEventListener('click', save);
    if (new URLSearchParams(location.search).get('save') === '1') {
      const btn = document.getElementById('saveBtn');
      if (isIOSSafari) { setTimeout(() => go(VCF), 500); }
      else { btn.classList.add('pulse'); setTimeout(() => show('again'), 400); }
    }
  })();
</script>
