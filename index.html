  .act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;white-space:nowrap;letter-spacing:-.02em;border-radius:14px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px;font-weight:600}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(27,36,48,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}

<script>

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.getElementById('smsBtn').href = (isIOS ? 'sms:&body=' : 'sms:?body=') + encodeURIComponent(cardText);
  document.getElementById('share').addEventListener('click', async () => {
    if (navigator.share) { try { await navigator.share({ title: '조하준 소장 | 블레스알파랩', text: cardText.replace('\n명함 보기·연락처 저장: ' + url, '\n명함 보기·연락처 저장:'), url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(cardText); } catch (e) { const t = document.createElement('textarea'); t.value = cardText; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    const el = document.getElementById('toast'); el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800);
  });
</script>
